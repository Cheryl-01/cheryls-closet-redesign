<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Product | Cheryl's Closet</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HEADER -->
  <header class="site-header">

    <a href="index.html" class="logo">
      <span>CHERYL'S</span>
      <strong>CLOSET</strong>
    </a>

    <nav class="desktop-nav">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>

    <div class="header-actions">
      <button aria-label="Search">⌕</button>
      <a href="cart.html" aria-label="Cart">🛍️</a>
    </div>

  </header>


  <!-- PRODUCT -->
  <main>

    <section class="product-detail">

      <!-- IMAGE -->

      <div class="product-detail-image">

        <div>👗</div>

      </div>


      <!-- INFORMATION -->

      <div class="product-detail-info">

        <p class="product-category">
          DRESSES
        </p>

        <h1>
          Mini Dress
        </h1>

        <span class="product-detail-price">
          ₦13,200
        </span>

        <p class="product-description">
          A stylish mini dress designed to add an effortless
          feminine touch to your wardrobe.
        </p>


        <!-- COLOUR -->

        <div class="product-option">

          <h3>Colour</h3>

          <button
            type="button"
            class="option-btn selected"
          >
            Black
          </button>

        </div>


        <!-- SIZE -->

        <div class="product-option">

          <h3>Size</h3>

          <div class="size-options">

            <button
              type="button"
              class="option-btn"
            >
              S
            </button>

            <button
              type="button"
              class="option-btn selected"
            >
              M
            </button>

            <button
              type="button"
              class="option-btn"
            >
              XL
            </button>

          </div>

        </div>


        <!-- QUANTITY -->

        <div class="product-option">

          <h3>Quantity</h3>

          <div class="quantity-control">

            <button
              type="button"
              id="quantity-minus"
            >
              −
            </button>

            <span id="quantity">
              1
            </span>

            <button
              type="button"
              id="quantity-plus"
            >
              +
            </button>

          </div>

        </div>


        <!-- ADD TO CART -->

        <button
          type="button"
          class="product-add-cart"
          id="add-to-cart"
        >
          ADD TO CART
        </button>


        <a
          href="shop.html"
          class="back-to-shop"
        >
          ← Continue Shopping
        </a>

      </div>

    </section>

  </main>


  <!-- MOBILE NAVIGATION -->

  <nav class="mobile-nav">

    <a href="index.html">
      <span>⌂</span>
      <small>Home</small>
    </a>

    <a href="shop.html">
      <span>♡</span>
      <small>Shop</small>
    </a>

    <a href="cart.html">
      <span>🛍️</span>
      <small>Cart</small>
    </a>

    <a href="about.html">
      <span>○</span>
      <small>About</small>
    </a>

  </nav>


  <footer>
    <p>© 2026 Cheryl's Closet</p>
  </footer>


  <script src="script.js"></script>

</body>
</html>
