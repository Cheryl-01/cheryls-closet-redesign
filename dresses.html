<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dresses | Cheryl's Closet</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HEADER -->
  <header class="site-header">

    <a href="index.html" class="logo">
      <span>CHERYL'S</span>
      <strong>CLOSET</strong>
    </a>

    <nav class="desktop-nav">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>

    <div class="header-actions">
      <button aria-label="Search">⌕</button>
      <a href="cart.html" aria-label="Cart">🛍️</a>
    </div>

  </header>


  <!-- CATEGORY HERO -->
  <main>

    <section class="category-hero">

      <p>CHERYL'S CLOSET</p>

      <h1>Dresses</h1>

      <span>Pieces made to make you feel beautiful.</span>

    </section>


    <!-- PRODUCTS -->
    <section class="products-section">

      <div class="products-heading">

        <div>
          <p>DRESSES</p>
          <h2>Our Collection</h2>
        </div>

        <span>3 pieces</span>

      </div>


      <div class="product-grid">


        <!-- PRODUCT 1 -->

        <article class="product-card">

          <a href="product.html?product=mini-dress" class="product-image">
            <div>👗</div>
          </a>

          <div class="product-info">

            <p>DRESS</p>

            <h3>Mini Dress</h3>

            <span class="product-price">₦13,200</span>

            <button class="add-cart-btn" data-product-id="mini-dress">
  ADD TO CART
</button>

          </div>

        </article>


        <!-- PRODUCT 2 -->

        <article class="product-card">

          <a href="product.html?product=long-dress" class="product-image">
            <div>👗</div>
          </a>

          <div class="product-info">

            <p>DRESS</p>

            <h3>Long Dress</h3>

            <span class="product-price">₦17,400</span>

            <button class="add-cart-btn" data-product-id="long-dress">
  ADD TO CART
            </button>

          </div>

        </article>


        <!-- PRODUCT 3 -->

        <article class="product-card">

          <a href="product.html?product=bodycon-dress" class="product-image">
            <div>👗</div>
          </a>

          <div class="product-info">

            <p>DRESS</p>

            <h3>Bodycon Dress</h3>

            <span class="product-price">₦16,800</span>

            <button class="add-cart-btn" data-product-id="bodycon-dress">
  ADD TO CART
            </button>

          </div>

        </article>


      </div>

    </section>

  </main>


  <!-- MOBILE NAVIGATION -->

  <nav class="mobile-nav">

    <a href="index.html">
      <span>⌂</span>

    </a>

      <span>🛍️</span>

    </a>

    <a href="about.html">
      <span>○</span>
      <small>About</small>
    </a>

  </footer>
